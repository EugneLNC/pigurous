[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-choreographer"
version = "0.1.0"
description = "Research implementation of audio-conditioned scene-event choreography"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "Pillow>=9", "torch==2.7.0"]

[project.optional-dependencies]
audio = ["transformers==4.46.3", "soundfile>=0.12", "beat-this==1.1.0", "torchaudio==2.7.0"]
test = ["pytest>=7"]

[project.scripts]
choreo = "choreographer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

